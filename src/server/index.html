<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camstream</title>
<!-- Ni script ni style en ligne : la politique CSP (script-src 'self') l'interdit. -->
<link rel="stylesheet" href="/camstream.css">
<script src="/camstream.js" defer></script>
</head>
<body>
<main>
  <!-- Le flux MJPEG est affiché nativement par la balise img, sans JavaScript. -->
  <img id="stream" class="waiting" src="/stream.mjpg" alt="Flux de la webcam">
  <p id="message">Démarrage de la caméra…</p>
</main>
</body>
</html>
