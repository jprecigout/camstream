<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camstream</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
               font-family: system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center;
         justify-content: center; min-height: 100%; gap: .75rem; }
  img { max-width: 100vw; max-height: 90vh; background: #000; }
  img.waiting { display: none; }
  #message { margin: 0; font-size: 1.1rem; }
</style>
</head>
<body>
<main>
  <!-- Le flux MJPEG est affiché nativement par la balise img, sans JavaScript. -->
  <img id="stream" class="waiting" src="/stream.mjpg" alt="Flux de la webcam">
  <p id="message">Démarrage de la caméra…</p>
</main>
<script>
  // Le script ne fait que masquer le message d'attente dès la première image,
  // et relancer le flux si la connexion tombe (redémarrage, Wi-Fi).
  const img = document.getElementById("stream");
  const message = document.getElementById("message");
  let retry = null;

  function shown() {
    img.classList.remove("waiting");
    message.hidden = true;
  }

  img.addEventListener("load", shown);
  // Selon le navigateur, « load » n'est pas toujours émis pour un flux multipart :
  // on surveille aussi l'apparition de la première image.
  setInterval(() => { if (img.naturalWidth > 0) shown(); }, 250);

  img.addEventListener("error", () => {
    img.classList.add("waiting");
    message.hidden = false;
    message.textContent = "Connexion au flux perdue, nouvelle tentative…";
    clearTimeout(retry);
    retry = setTimeout(() => { img.src = "/stream.mjpg?t=" + Date.now(); }, 3000);
  });
</script>
</body>
</html>
